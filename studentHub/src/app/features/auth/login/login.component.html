<h2>Login</h2>

<form (ngSubmit)="login()">
  <label>Email</label>
  <input
    type="email"
    [(ngModel)]="email"
    name="email"
    autocomplete="email"
  />

  <br />

  <label>Password</label>
  <input
    type="password"
    [(ngModel)]="password"
    name="password"
    autocomplete="current-password"
  />

  <br />

  <button type="submit">Login</button>

  <p>
    Not registered?
    <a routerLink="/register">Register</a>
  </p>
</form>
