
<h2>My Listings</h2>


<div class="cards">
<div *ngFor="let item of listings" class="card">
  <h4>{{ item.name }} ({{ item.type }})</h4>
  <p>Status: {{ item.active ? 'Active' : 'Inactive' }}</p>
  <button (click)="toggleStatus(item)">
    {{ item.active ? 'Deactivate' : 'Activate' }}
  </button>
<a [routerLink]="['/owner/edit-listing', item.id]">Edit</a>
</div>
</div>
